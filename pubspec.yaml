name: black_market
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.18.1
  dio: ^5.9.0
  cupertino_icons: ^1.0.8
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_core: ^4.10.0
  google_fonts: ^8.1.0
  toastification: ^3.2.0
  google_sign_in: ^7.2.0
  mask_text_input_formatter: ^2.9.0
  shimmer: ^3.0.0
  google_mobile_ads: ^9.0.0
  lottie: ^3.5.1
  shared_preferences: ^2.5.5
  share_plus: ^13.2.1
  google_maps: ^8.2.0
  geolocator: ^14.0.3
  google_maps_flutter: ^2.18.0
  date_format: ^2.0.9
  file_picker: ^12.0.0-beta.1
  firebase_storage: ^13.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/image/
    - assets/lottie/
    - assets/icons/
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/Shopping Cart Logo Design.png"
